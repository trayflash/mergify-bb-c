queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
    merge_conditions:
      - check-success=ci

pull_request_rules:
  - name: BBCANARY-7731 fast path
    conditions:
      - base=main
      - author=trayflash
    actions:
      merge:
        method: merge
  - name: queue it
    conditions:
      - base=main
    actions:
      queue:
        name: default
